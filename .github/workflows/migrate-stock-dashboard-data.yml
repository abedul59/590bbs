name: Migrate stock dashboard history

on:
  push:
    branches: [main]
    paths:
      - scripts/migrate-stock-dashboard-data.mjs
      - .github/workflows/migrate-stock-dashboard-data.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Export records from the original stock dashboard
        run: node scripts/migrate-stock-dashboard-data.mjs
      - name: Commit the portable database snapshot
        run: |
          git add server/assets/stock-dashboard-records.json
          if git diff --cached --quiet; then
            echo "Stock dashboard data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Migrate stock dashboard history"
          git push
