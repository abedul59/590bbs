name: Build SHJHS Evidence Uploader for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/shjhs-evidence-uploader/**"
      - ".github/workflows/build-shjhs-uploader-windows.yml"
    tags:
      - "shjhs-uploader-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/shjhs-evidence-uploader
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: tools/shjhs-evidence-uploader/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Generate Windows manifest resource
        shell: pwsh
        run: |
          go install github.com/akavel/rsrc@latest
          & "$(go env GOPATH)\bin\rsrc.exe" -manifest app.exe.manifest -o rsrc_windows_amd64.syso

      - name: Test
        run: go test ./...

      - name: Build GUI executable
        run: go build -trimpath -ldflags="-H windowsgui -s -w" -o SHJHS_Evidence_Uploader.exe .

      - name: Create portable package
        shell: pwsh
        run: Compress-Archive -Path SHJHS_Evidence_Uploader.exe,config.example.json,README.md -DestinationPath SHJHS_Evidence_Uploader_Windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: SHJHS-Evidence-Uploader-Windows
          path: |
            tools/shjhs-evidence-uploader/SHJHS_Evidence_Uploader.exe
            tools/shjhs-evidence-uploader/SHJHS_Evidence_Uploader_Windows.zip
            tools/shjhs-evidence-uploader/config.example.json

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/shjhs-uploader-v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            tools/shjhs-evidence-uploader/SHJHS_Evidence_Uploader.exe
            tools/shjhs-evidence-uploader/SHJHS_Evidence_Uploader_Windows.zip
            tools/shjhs-evidence-uploader/config.example.json
