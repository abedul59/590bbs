name: Update MacroWave 0050 lead data

on:
  push:
    branches: [main]
    paths:
      - scripts/update-macrowave-lead-data.mjs
      - public/macrowave-leading-indicators.json
      - .github/workflows/update-macrowave-lead-data.yml
  schedule:
    - cron: '20 3 2 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate joined 0050 and leading-indicator history
        run: node scripts/update-macrowave-lead-data.mjs
      - name: Commit refreshed data
        run: |
          if git diff --quiet -- public/macrowave-lead-data.json; then
            echo "Data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/macrowave-lead-data.json
          git commit -m "Update MacroWave 0050 lead data"
          git push
