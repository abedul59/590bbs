name: Build PER Auto for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/fred-mark17-windows-build
    tags:
      - per-auto-v*
    paths:
      - tools/per_auto/**
      - .github/workflows/build-per-auto-windows.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/per_auto/requirements-per-auto.txt
      - name: Install dependencies
        run: python -m pip install -r tools/per_auto/requirements-per-auto.txt pyinstaller==6.18.0
      - name: Validate and test Python source
        run: |
          python -m py_compile tools/per_auto/PER_auto.py
          python -m unittest tools/per_auto/test_per_auto.py
      - name: Build Windows executable
        run: >-
          pyinstaller --noconfirm --clean --onefile --console
          --name PER_Auto
          --collect-all pandas
          --collect-all bs4
          --collect-all lxml
          --collect-all html5lib
          tools/per_auto/PER_auto.py
      - name: Assemble download folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package
          Copy-Item dist/PER_Auto.exe package/
          Copy-Item tools/per_auto/stock_id_settings.example.csv package/
          Copy-Item tools/per_auto/README.md package/README.md
          Compress-Archive -Path package/PER_Auto.exe,package/stock_id_settings.example.csv,package/README.md -DestinationPath PER_Auto_Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PER_Auto_Windows
          path: package/*
          if-no-files-found: error
          retention-days: 90
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/per-auto-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            package/PER_Auto.exe `
            package/stock_id_settings.example.csv `
            PER_Auto_Windows.zip `
            --title "PER Auto Windows $env:GITHUB_REF_NAME" `
            --notes "台股六大指標與本益比區間分析工具。同步至原 Stock Dashboard 與 590bbs 總大六大指標和本益比區間分析。"
